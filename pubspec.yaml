name: workout_tracker
description: "Offline workout tracker for Android: split-day plans, warm-up / cool-down, live workout logging, history and CSV backup."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Database (SQLite) + small settings
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6

  # State + navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Platform features
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  file_picker: ^13.4.0
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space-grotesk-500.ttf
          weight: 500
        - asset: assets/fonts/space-grotesk-600.ttf
          weight: 600
        - asset: assets/fonts/space-grotesk-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-400.ttf
          weight: 400
        - asset: assets/fonts/inter-500.ttf
          weight: 500
        - asset: assets/fonts/inter-600.ttf
          weight: 600
        - asset: assets/fonts/inter-700.ttf
          weight: 700
